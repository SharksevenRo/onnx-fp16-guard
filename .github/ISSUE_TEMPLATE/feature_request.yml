name: Feature request
description: An op to block, a strategy to add, or an integration you need.
title: '[feat]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The failure mode matters more than the proposed API.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: CLI flag, option, function signature — as concrete as you like.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Conversion / graph surgery
        - Overflow detection or repair
        - CLI
        - Browser support
        - Documentation
        - Runtime integration (onnxruntime-web, WebGPU, …)
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked ROADMAP.md first.
          required: true
        - label: I am willing to open a PR for this.
          required: false
